<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusGFX — Connexion...</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#060605; color:#ede9d8;
  font-family:'DM Sans',sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
body::before {
  content:''; position:fixed; inset:0;
  background:radial-gradient(circle at center, rgba(201,168,76,0.08) 0%, transparent 60%);
  pointer-events:none;
}
.box {
  text-align:center; position:relative; z-index:1;
  animation: fadeIn 0.6s ease forwards;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

.hex {
  width:72px; height:72px; margin:0 auto 28px;
  background:linear-gradient(135deg,#e8c96d,#7a6330);
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  display:flex; align-items:center; justify-content:center;
  font-family:'Playfair Display',serif; font-size:28px; font-weight:900; color:#000;
  animation: spin 2s linear infinite;
}
@keyframes spin { to{transform:rotate(360deg)} }

h2 {
  font-family:'Playfair Display',serif;
  font-size:28px; font-weight:900; color:#f8f5e8; margin-bottom:10px;
}
p { font-size:14px; color:#5a5748; }
.status { margin-top:20px; font-size:13px; color:#c9a84c; letter-spacing:1px; }
.error-box {
  display:none; margin-top:24px;
  background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.2);
  border-radius:14px; padding:16px 24px;
  font-size:13px; color:#fca5a5;
}
</style>
</head>
<body>
<div class="box">
  <div class="hex">N</div>
  <h2>Connexion en cours...</h2>
  <p>Vérification de votre compte Discord</p>
  <div class="status" id="status">Échange du token...</div>
  <div class="error-box" id="errorBox"></div>
</div>

<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');
  const status = document.getElementById('status');
  const errorBox = document.getElementById('errorBox');

  if (error || !code) {
    status.textContent = 'Connexion annulée.';
    errorBox.style.display = 'block';
    errorBox.textContent = error === 'access_denied' ? 'Vous avez annulé la connexion Discord.' : 'Une erreur est survenue. Veuillez réessayer.';
    setTimeout(() => window.location.href = '/', 3000);
    return;
  }

  try {
    status.textContent = 'Récupération de votre profil...';
    const res = await fetch(`/.netlify/functions/discord-auth?code=${encodeURIComponent(code)}`);
    const user = await res.json();

    if (user.error) throw new Error(user.error);

    // Save user to localStorage
    localStorage.setItem('nexusgfx_user', JSON.stringify(user));
    status.textContent = `Bienvenue ${user.global_name} ! Redirection...`;

    setTimeout(() => window.location.href = '/', 1500);
  } catch (err) {
    status.textContent = 'Erreur de connexion.';
    errorBox.style.display = 'block';
    errorBox.textContent = `Erreur : ${err.message}`;
    setTimeout(() => window.location.href = '/', 3000);
  }
})();
</script>
</body>
</html>
